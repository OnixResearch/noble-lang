name = "noble-mc1-contracts"
defaultTargets = ["NobleContracts"]

[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "1238879f9ea550512096e9bf8bd6fe7407b3eaef"

[[lean_lib]]
name = "NobleContracts"
# The CLI's rule-library consumer compiles every module under `NobleContracts/`
# (`rules::read_library`), not only the modules imported by the root. Build the
# same set here, so a plain `lake build` produces the oleans the consumer and
# `ContractGate.lean` use (for example `NobleContracts.Refutation`, which is
# intentionally outside the pinned `MODEL` import closure).
globs = ["NobleContracts", "NobleContracts.+"]

[[lean_lib]]
name = "NobleContractImpl"

[[lean_lib]]
name = "NobleKernel"
srcDir = "../m3"

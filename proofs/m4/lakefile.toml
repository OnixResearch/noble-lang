name = "noble-m4-extraction"
defaultTargets = ["M4Audit", "NobleContractImpl", "NobleWasmImpl"]

[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "505b6ca35217e7be5c96c3e2f8045edfbdf47291"

[[lean_lib]]
name = "M4Audit"

[[lean_lib]]
name = "NobleKernel"
srcDir = "../m3"

[[lean_lib]]
name = "NobleContractImpl"
srcDir = "../mc1"
globs = ["NobleContractImpl", "NobleContractImpl.Projection"]

[[lean_lib]]
name = "NobleContracts"
srcDir = "../mc1"

[[lean_lib]]
name = "NobleWasmImpl"
srcDir = "../m3-wasm"

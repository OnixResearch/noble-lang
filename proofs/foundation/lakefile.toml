name = "noble-foundation"
defaultTargets = ["NobleFoundation"]
# Mathlib declares itself designed for the module system, and Lake warns on every
# import of it from a file without a `module` header. These proof files are not
# module-system files; this is Lake's documented opt-out for such importers.
allowNonModules = true

# Same Lean/Mathlib pins as proofs/m3 and proofs/mc1: Mathlib4 arrives through
# the pinned Aeneas backend (see lake-manifest.json). The MC1 model and the
# independent comparator oracle are compiled from their existing sources, not
# copied, so this project proves facts about exactly those definitions.
[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "1238879f9ea550512096e9bf8bd6fe7407b3eaef"

[[lean_lib]]
name = "NobleFoundation"

[[lean_lib]]
name = "NobleContracts"
srcDir = "../mc1"

[[lean_lib]]
name = "MathlibI64"
srcDir = "../m3"

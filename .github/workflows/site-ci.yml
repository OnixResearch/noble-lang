name: Build draft documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: noble-lang-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the same Bun as the pinned nixpkgs input
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Check and build the canonical static tree
        env:
          SITE_REVISION: ${{ github.sha }}
        run: |
          bun test tools/site.test.mjs
          bun tools/site.mjs build --out site-dist --revision "$SITE_REVISION"
          test -s site-dist/index.html
          test -s site-dist/guide/index.html
          test -s site-dist/start/index.html
          test -s site-dist/spec/language/index.html
          test -s site-dist/playground/index.html
          ! grep -q '<script' site-dist/index.html

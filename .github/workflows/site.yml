name: Publish draft documentation

# Publishes every push to main, and on manual dispatch from main. The Cloudflare zone,
# the Pages project and the custom domains were verified against the live site before
# the push trigger was added. A run without both docs-production secrets builds the
# tree and skips publication with a warning. This workflow does not change DNS.
# site-ci.yml builds the tree on pull requests and pushes without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noble-lang-production-site
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch on another branch must never publish production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docs-production
    env:
      # Secrets cannot appear in step conditions; expose only whether both exist.
      PUBLISH_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the same Bun as the pinned nixpkgs input
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Check and build the canonical static tree
        env:
          SITE_REVISION: ${{ github.sha }}
        run: |
          bun test tools/site.test.mjs
          bun tools/site.mjs build --out site-dist --revision "$SITE_REVISION"
      - name: Report unconfigured publication credentials
        if: env.PUBLISH_CONFIGURED != 'true'
        run: echo "::warning title=Publication skipped::docs-production lacks CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID; the site was tested and built but not published."
      - name: Publish to the Cloudflare Pages production branch
        if: env.PUBLISH_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.72.0
          packageManager: npm
          command: pages deploy site-dist --project-name=noble-lang --branch=main --commit-hash=${{ github.sha }}

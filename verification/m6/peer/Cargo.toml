[package]
name = "noble-m6-peer"
version = "0.0.0"
edition = "2024"
publish = false

# Independent Canonical ABI/bindgen host; never imports Noble compiler code.
[workspace]

[dependencies]
anyhow = "=1.0.100"
serde_json = "=1.0.140"
parking_lot = { path = "/nix/store/i9qi2rh8xwv1pk66443wywkvqnpjbv9l-cargo-package-parking_lot-0.12.5" }
tokio = { version = "=1.48.0", features = ["rt", "time", "macros", "sync"] }
wasmtime = { path = "/nix/store/26a8xzacbx01hidm70lpyphyw926zhc5-source/crates/wasmtime", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "component-model-async", "wat"] }
wasmtime-wasi = { path = "/nix/store/26a8xzacbx01hidm70lpyphyw926zhc5-source/crates/wasi", default-features = false, features = ["p3"] }
noble-kernel = { path = "../../../crates/noble-kernel" }

[patch.crates-io]
lock_api = { path = "/nix/store/5mwhb6hsn5bvvgnbasgzbsb2173mcb8m-cargo-package-lock_api-0.4.14" }
parking_lot_core = { path = "/nix/store/75qqqmy8xz4kzsf4jgzg2xi3asmgnbbw-cargo-package-parking_lot_core-0.9.12" }
scopeguard = { path = "/nix/store/0g2ipzda8dsp4jvmkqmmgmi4m1d3w573-cargo-package-scopeguard-1.2.0" }
redox_syscall = { path = "/nix/store/ia1hffmz062l0z0rjj1x1pcyzqn3lxq2-cargo-package-redox_syscall-0.5.17" }
windows-link = { path = "/nix/store/11qyih4kprkpmfybwpq4y60z8bx9jhm4-cargo-package-windows-link-0.2.1" }

[profile.dev]
debug = 0

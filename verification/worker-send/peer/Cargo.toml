[package]
name = "noble-worker-send-peer"
version = "0.0.0"
edition = "2024"
publish = false

# Independent Component Model host: never grants authority from guest Action data.
[workspace]

[dependencies]
anyhow = "=1.0.100"
libc = "=0.2.177"
serde_json = "=1.0.140"
sha2 = "=0.10.2"
parking_lot = { path = "/nix/store/i9qi2rh8xwv1pk66443wywkvqnpjbv9l-cargo-package-parking_lot-0.12.5" }
tokio = { version = "=1.48.0", features = ["rt", "time", "macros", "sync"] }
wasmtime = { path = "/nix/store/26a8xzacbx01hidm70lpyphyw926zhc5-source/crates/wasmtime", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "component-model-async", "wat"] }
noble-kernel = { path = "../../../crates/noble-kernel" }

[profile.dev]
debug = 0

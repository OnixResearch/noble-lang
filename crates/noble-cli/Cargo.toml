[package]
name = "noble-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "noble"

[[bin]]
name = "noble"
path = "src/main.rs"

[features]
# Test-only synchronization of real CLI/worker safepoints; never shipped by
# the default binary. Production host-only revocation is available without
# this feature and does not change guest bytes.
live-test-barrier = []
# Only a separately feature-built private LIVE-05 harness may issue a single
# source-bound test.emit/test.abort grant; default live and run stay unchanged.
live05-harness-effects = [
    "noble-contracts/live05-harness-effects",
    "noble-wasm/live05-harness-effects",
]

[dependencies]
noble-kernel = { path = "../noble-kernel" }
noble-contracts = { path = "../noble-contracts" }
noble-wasm = { path = "../noble-wasm" }
anyhow = "=1.0.100"
libc = "=0.2.189"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "event"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
wat = { version = "=1.243.0", default-features = false }
wasmparser = { version = "=0.243.0", default-features = false, features = ["std", "features", "validate"] }
wasmtime = { path = "/nix/store/26a8xzacbx01hidm70lpyphyw926zhc5-source/crates/wasmtime", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "gc", "gc-drc"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true

# Run from the reviewed devShell. The absolute selected gate path cannot
# resolve to an ambient PATH binary; if not realized on this host, it fails closed.
# Upstream Octet's source revision remains pinned in flake.nix and flake.lock.
repos:
  - repo: local
    hooks:
      - id: octet-deny-all
        name: Noble selected Octet deny-all
        entry: /nix/store/18bpmd4pnam032fa428sdfqnxbvzq1v1-noble-octet-gate/bin/noble-octet-gate
        language: system
        pass_filenames: false
        always_run: true
        args: ["--workspace", "--", "--all-targets", "--all-features"]
